l_simp_chinese:
 PMT_formable_nation_news.1.t: "阿散蒂统一"
 PMT_formable_nation_news.1.desc: "在库马西，阿散蒂各邦酋长再次围聚于金凳子前宣誓效忠，一个曾被殖民者拆散的邦联终于重新统一。这个西非古国曾以黄金与勇武闻名，也曾在雅·阿散蒂娃的率领下为守护金凳子与英军血战。如今，新生的阿散蒂宣布结束外国统治，恢复祖先的秩序。但黄金海岸的殖民遗产尚未清除，复兴之路注定不会平坦。"
 PMT_formable_nation_news.1.a: "金凳子与我们同在！"
 PMT_formable_nation_news.1.b: "那么……呃……他们在哪儿？"
 PMT_formable_nation_news.2.t: "越南重建"
 PMT_formable_nation_news.2.desc: "历经多年割据与冲突，越南各派力量终于达成统一，一个以[ROOT.GetNameDef]为名的新国家正式登上历史舞台。河内、顺化、西贡等主要城市相继纳入新政府控制之下，南北之间的隔阂开始被打破。新政权宣布将致力于清除殖民时代的遗留影响，重建国家经济与军事力量。然而，战争留下的创伤尚未愈合，统一只是漫长复兴之路的起点。"
 PMT_formable_nation_news.2.a: "我们不再分裂！"
 PMT_formable_nation_news.2.b: "总算"
 PMT_formable_nation_news.3.t: "印度支那的统一"
 PMT_formable_nation_news.3.desc: "随着最后一份合并文书在马德望签署，[ROOT.GetNameDef]正式宣告成立。越南、老挝、柬埔寨以及原法属印度支那的各个地区，如今被统一在同一个政权之下。新政府宣称，这是对殖民统治结束后印度支那长期分裂局面的终结，也是印度支那各族人民在[From.GetLeader]的领导下走向复兴的开始。从红河三角洲到湄公河平原，各地举行了规模不等的庆祝活动，但在这片新联盟的土地上，真正的整合才刚刚开始。"
 PMT_formable_nation_news.3.a: "印度支那万岁！"
 PMT_formable_nation_news.3.b: "有意思"