l_simp_chinese:
 ashanti_category: "阿散蒂"
 ashanti_category_desc: "阿散蒂邦联曾以黄金贸易和强大军队称雄西非，金凳子是阿坎人共同尊奉的神圣象征。殖民统治曾使这个古老邦联分崩离析，但加纳、科特迪瓦和多哥的土地上仍留存着阿散蒂的荣光。如今，恢复这个古老国家的时机或许已经成熟。"
 unite_ashanti: "统一阿散蒂"
 unite_ashanti_desc: "随着加纳、科特迪瓦和多哥都归于我们控制，我们终于能够重新统一阿散蒂，在库马西恢复金凳子的权威。"
 #以下由更的水杯负责
 vietnam_category: "越南局势"
 form_vietnam: "统一越南"
 indochina_category: "统一印度支那"
 indochina_category_desc: "自从19世纪上半叶开始，越南政权就不断尝试打破地理的藩篱向西扩张，但这一过程最终却由法国殖民者完成了。在越南的知识分子的宜传中，整个法属印度支那应当在越南的领导之下团结起来对抗法国殖民者。如今法国殖民者已经远去，但印度支那地区仍旧纷争不断，但不论是顺化的皇帝还是占巴塞的亲王都知道，只有能以武力威服东南亚的国家，才能够塑造印度支那新的地区秩序。"
 form_indochina: "成立印度支那联盟"